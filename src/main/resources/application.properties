# ==============================================================================
# Configuracao da Aplicacao - Sistema de Gestao de Plantas Industriais (ESEG)
# ==============================================================================
spring.application.name=plantas-industriais
server.port=8080

# Banco relacional H2 em modo arquivo (persistencia real entre reinicializacoes)
spring.datasource.url=jdbc:h2:file:./data/plantasdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 disponivel em http://localhost:8080/h2-console (perfil ADMIN)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf (cache desabilitado para facilitar ajustes em desenvolvimento)
spring.thymeleaf.cache=false

