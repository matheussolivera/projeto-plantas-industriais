<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acesso ao Sistema')}"></head>
<body class="login-wrapper d-flex align-items-center justify-content-center p-3">

<div class="card card-clean shadow-lg" style="max-width: 440px; width: 100%;">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="display-5 text-primary mb-2"><i class="bi bi-building-gear"></i></div>
            <h4 class="fw-bold mb-1">Gestão de Plantas Industriais</h4>
            <p class="text-muted small mb-0">Projeto Integrador Full Stack — ESEG</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small">
            <i class="bi bi-x-circle me-1"></i>Usuário ou senha inválidos.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2 small">
            <i class="bi bi-info-circle me-1"></i>Sessão encerrada com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Usuário</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Digite seu usuário" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Senha</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
            </button>
        </form>

        <hr class="my-4">
        <div class="bg-light rounded p-3 small text-muted">
            <div class="fw-semibold text-dark mb-1"><i class="bi bi-key me-1"></i>Perfis de demonstração:</div>
            <div><strong>ADMIN:</strong> <code>admin</code> / <code>admin123</code> (CRUD completo, status e auditoria)</div>
            <div><strong>OPERADOR:</strong> <code>operador</code> / <code>operador123</code> (consulta e gestão de linhas)</div>
        </div>
    </div>
</div>

</body>
</html>
