<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container text-center py-5">
    <div class="display-3 text-warning mb-3"><i class="bi bi-exclamation-octagon"></i></div>
    <h2 class="fw-bold" th:text="${codigo} + ' — ' + ${titulo}">Erro</h2>
    <p class="text-muted mb-4" th:text="${mensagem}">Ocorreu um erro ao processar sua solicitação.</p>
    <a th:href="@{/plantas}" class="btn btn-primary">Voltar ao Catálogo</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
